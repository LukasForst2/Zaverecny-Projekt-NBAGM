<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/basketball.ico">
    <link rel="stylesheet" href="styles.css">
    <title>NBA Simulator</title>
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="title  vert-center-col" id="title">
                <h1>NBA Simulator</h1>
            </div>
            <div class="search-bar vert-center-col">
                <input type="text" id="searchInp" placeholder="Enter player name...">
                <div id="searchRes" class="suggestions-box"></div>
            </div>
            <div class="filters">
                <label for=""><input type="checkbox" id="filterGuard" checked>Guard</label>
                <label for=""><input type="checkbox" id="filterWing" checked>Wing</label>
                <label for=""><input type="checkbox" id="filterBig" checked>Big</label>
            </div>
       </header>

    <main class="matchup vert-center-row">
        <section class="team-column" id="teamA">
            <h2 class="team-header" id="teamAheader">Team A</h2>
            <div class="name-bar vert-center-col">
                <input type="text" class="team-name" id="teamAnameInp" placeholder="Enter name for team A...">
            </div>
            <div class="roster-chart" id="teamAchart">
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
            </div>
            <div class="team-stats" id="teamAstats">
                <p id="teamAcap" class="team-atb"></p>
                <p id="teamAscoring" class="team-atb"></p>
                <p id="teamAshooting" class="team-atb"></p>
                <p id="teamAplaymaking" class="team-atb"></p>
                <p id="teamAdefense" class="team-atb"></p>
                <p id="teamArebounding" class="team-atb"></p>
                <p id="teamAoverall" class="team-atb"></p>
            </div>
            
        </section>

        <section class="center-block">
            <div id="playerPool" class="player-pool">
                <h2>Available Players</h2>
            </div>
            <div class="playerListCont">
                <ul id="playerListUl">
                    <!-- Zde se zobrazí seznam hráčů pomoci ts -->
                </ul>
            </div>
            <div class="simulate-button vert-center-col">
                <button id="simulateBtn">Simulate</button>
            </div>
        </section>

        <section class="team-column" id="teamB">
            <h2 class="team-header" id="teamBheader">Team B</h2>
             <div class="name-bar vert-center-col">
                <input type="text" class="team-name" id="teamBnameInp" placeholder="Enter name for team B...">
            </div>
            <div class="roster-chart" id="teamBchart">
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
                <div class="slot empty">Empty slot...</div>
            </div>
            <div class="team-stats" id="teamBstats">
                <p id="teamBcap" class="team-atb"></p>
                <p id="teamBscoring" class="team-atb"></p>
                <p id="teamBshooting" class="team-atb"></p>
                <p id="teamBplaymaking" class="team-atb"></p>
                <p id="teamBdefense" class="team-atb"></p>
                <p id="teamBrebounding" class="team-atb"></p>
                <p id="teamBoverall" class="team-atb"></p>
            </div>
        </section>
    </main>

    </div>
    <script type="module" src="script.js"></script>
    <script type="module" src="web.js"></script>
</body>
</html>
