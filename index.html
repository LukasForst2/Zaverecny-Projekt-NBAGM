<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/basketball.ico">
    <link rel="stylesheet" href="styles.css">
    <title>NBA Simulator</title>
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="title  vert-center-col" id="title">
                <h1>NBA Simulator</h1>
            </div>
            <div class="search-bar vert-center-col">
                <input type="text" id="searchInp" placeholder="Enter player name...">
                <div id="searchRes" class="suggestions-box"></div>
            </div>
            <div class="filters">
                <label for=""><input type="checkbox" id="filterGuard" checked>Guard</label>
                <label for=""><input type="checkbox" id="filterWing" checked>Wing</label>
                <label for=""><input type="checkbox" id="filterBig" checked>Big</label>
            </div>
       </header>

    <main class="matchup vert-center-row">
        <section class="team-column" id="teamA">
            <h2 class="team-header" id="teamAheader"></h2>
            <div class="name-bar vert-center-col">
                <input type="text" class="team-name" id="teamAnameInp" placeholder="Enter name for team A...">
            </div>
            <div class="roster-chart" id="teamAchart">
                <!-- Zde se zobrazí seznam hráčů pomoci ts -->
            </div>
            <button class="clear-team-btn" id="clearTeamA">Clear Team</button>
            <div class="team-stats" id="teamAstats">
                <h2 class="stats-header">Stats</h2>
                <div id="teamAcap" class="team-atb"></div>
                <div id="teamAscoring" class="team-atb"></div>
                <div id="teamAshooting" class="team-atb"></div>
                <div id="teamAplaymaking" class="team-atb"></div>
                <div id="teamAdefense" class="team-atb"></div>
                <div id="teamArebounding" class="team-atb"></div>
                <div id="teamAoverall" class="team-atb"></div>
            </div>
            <div class="weakness-card">
                <h2 class="stats-header">Weaknesess</h2>
                <div class="weaknesses-list" id="weaknessesA">
                    <!-- tady se vypisou pomoci funkce v classe tym, slabiny tymu, pokud nejake má-->
                </div>
            </div>
        </section>

        <section class="center-block">
            <div id="playerPool" class="player-pool">
                <h2>Available Players</h2>
            </div>
            <div class="playerListCont">
                <ul id="playerListUl">
                    <!-- Zde se zobrazí seznam hráčů pomoci ts -->
                </ul>
            </div>
            <div class="simulate-card vert-center-col">
            <h2 id="matchHeader"></h2>
                <button id="simulateBtn">Simulate</button>
                <div class="simulate-res">
                    
                </div>
            </div>
        </section>

        <section class="team-column" id="teamB">
            <h2 class="team-header" id="teamBheader"></h2>
             <div class="name-bar vert-center-col">
                <input type="text" class="team-name" id="teamBnameInp" placeholder="Enter name for team B...">
            </div>
            <div class="roster-chart" id="teamBchart">
                 <!-- Zde se zobrazí seznam hráčů pomoci ts -->
            </div>
            <button class="clear-team-btn" id="clearTeamB">Clear Team</button>
            <div class="team-stats" id="teamBstats">
                <h2 class="stats-header">Stats</h2>
                <div id="teamBcap" class="team-atb"></div>
                <div id="teamBscoring" class="team-atb"></div>
                <div id="teamBshooting" class="team-atb"></div>
                <div id="teamBplaymaking" class="team-atb"></div>
                <div id="teamBdefense" class="team-atb"></div>
                <div id="teamBrebounding" class="team-atb"></div>
                <div id="teamBoverall" class="team-atb"></div>
            </div>
            <div class="weakness-card">
                <h2 class="stats-header">Weaknesess</h2>
                <div class="weaknesses-list" id="weaknessesB">
                    <!-- tady se vypisou pomoci funkce v classe tym, slabiny tymu, pokud nejake má-->
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; Lukáš Forst IT2A, 2026 NBA Simulator.</p>
    </footer>
    </div>
    <script type="module" src="script.js"></script>
    <script type="module" src="web.js"></script>
</body>
</html>
